name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "45 23 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh lottery data
        if: github.event_name != 'push'
        run: npm run sync:data

      - name: Commit refreshed data
        if: github.event_name != 'push'
        shell: bash
        run: |
          if git diff --quiet -- src/data/mega645-history.json src/data/power655-history.json src/data/lotto535-history.json; then
            echo "Lottery data is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/mega645-history.json src/data/power655-history.json src/data/lotto535-history.json
            git commit -m "chore(data): refresh Vietlott history"
            git push
          fi

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Remove previous Pages artifacts for this run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_ids=$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name == "github-pages") | .id')
          while IFS= read -r artifact_id; do
            [[ -z "$artifact_id" ]] && continue
            curl --fail-with-body --silent --show-error --request DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              --output /dev/null
          done <<< "$artifact_ids"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
